name: Back up WLED firmware

# Copies every WLED release's firmware into backup/ in this repo, so this
# installer still works if WLED's own servers disappear. Runs weekly to pick
# up new releases, and can be run by hand from the Actions tab.

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/backup-firmware.yml
      - tools/backup_firmware.py
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-firmware
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download firmware
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/backup_firmware.py
      - name: Commit new files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add backup
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Back up WLED firmware ($(date -u +%F))"
          git push
